name: Public demo Docker smoke

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "railway.json"
      - "scripts/start-public-demo.mjs"
      - "apps/web/**"
      - "apps/benchmark/**"
      - "packages/**"
      - ".github/workflows/public-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Railway Docker image including Chromium
        run: docker build --progress=plain -t choicemirror-public-smoke .
      - name: Run isolated app + benchmark and verify a real browser journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cm-public-volume"
          docker run -d --name choicemirror-public-test -p 3000:3000 \
            -v "$RUNNER_TEMP/cm-public-volume:/data" \
            -e PUBLIC_DEMO_ENABLED=1 -e PORT=3000 \
            -e RAILWAY_PROJECT_ID=ci-public-demo \
            -e RAILWAY_VOLUME_MOUNT_PATH=/data \
            -e CHOICEMIRROR_DATA_DIR=/data \
            -e NEBIUS_API_KEY=ci-test-only-never-valid \
            -e PUBLIC_DEMO_HASH_SECRET=ci-private-test-secret \
            -e PUBLIC_DEMO_DAILY_TOTAL_LIMIT=2 \
            -e PUBLIC_DEMO_DAILY_AI_LIMIT=1 \
            -e PUBLIC_DEMO_DAILY_VISITOR_LIMIT=1 \
            choicemirror-public-smoke
          trap 'docker logs choicemirror-public-test || true; docker rm -f choicemirror-public-test || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/cm-health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "::error::Docker container was not healthy."
            exit 1
          fi
          cat /tmp/cm-health.json
          curl -fsS -X POST "http://127.0.0.1:3000/api/comparisons" \
            -H "origin: http://127.0.0.1:3000" \
            -H "content-type: application/json" \
            -d '{"scenarioId":"membership-balanced","goalIds":["join","leave"],"mode":"deterministic"}' \
            > /tmp/cm-result.json
          cmpid=$(node -e 'const x=require("/tmp/cm-result.json"); if (!/^cmp_[a-f0-9]{16}$/.test(x.comparisonId)) process.exit(1); process.stdout.write(x.comparisonId)')
          echo "Comparison started: $cmpid"
          done_run=false
          for i in $(seq 1 120); do
            status=$(curl -fsS "http://127.0.0.1:3000/api/comparisons/$cmpid" | \
              node -e 'let s=""; process.stdin.on("data", x=>s+=x).on("end",()=>{const d=JSON.parse(s); console.log(d.comparison.status)})')
            if [ "$status" = completed ]; then
              done_run=true
              break
            fi
            if [ "$status" = failed ]; then
              echo "::error::Deterministic comparison failed in Docker."
              exit 1
            fi
            sleep 1
          done
          if [ "$done_run" != true ]; then
            echo "::error::Docker comparison did not complete."
            exit 1
          fi
          # Same visitor is now limited: quota persists inside the mounted volume.
          response=$(curl -sS -o /tmp/cm-second.json -w "%{http_code}" -X POST \
            "http://127.0.0.1:3000/api/comparisons" \
            -H "origin: http://127.0.0.1:3000" \
            -H "content-type: application/json" \
            -d '{"scenarioId":"membership-balanced","goalIds":["join","leave"],"mode":"deterministic"}')
          if [ "$response" != 429 ]; then
            echo "::error::Persistent daily visitor quota was bypassed ($response)."
            exit 1
          fi
          echo "Quota correctly blocked second comparison."
          # A third-party Origin must not be allowed to spend the owner's credits.
          response=$(curl -sS -o /tmp/cm-foreign.json -w "%{http_code}" -X POST \
            "http://127.0.0.1:3000/api/comparisons" \
            -H "origin: https://evil.example" \
            -H "content-type: application/json" \
            -d '{"scenarioId":"membership-balanced","goalIds":["join","leave"],"mode":"ai"}')
          if [ "$response" != 403 ]; then
            echo "::error::Cross-origin public POST was not rejected ($response)."
            exit 1
          fi
          if curl -fsS http://127.0.0.1:3000/ | grep -F 'ci-test-only-never-valid'; then
            echo "::error::Server-side model secret was exposed in HTML."
            exit 1
          fi
          echo "Verified packaged Chromium run, private key, persistent limit and origin protection."
