name: Verify OrbitPass with genuine Nebius AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-nebius-case-study:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check private key
        shell: bash
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          if [[ -z "$NEBIUS_API_KEY" ]]; then
            echo "::error::Configure NEBIUS_API_KEY as a protected Actions secret."
            exit 1
          fi
      - name: Test genuine model navigation on both fictional interfaces
        env:
          NEBIUS_LIVE: "1"
          NEBIUS_CASE_STUDY: "1"
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: pnpm exec playwright test --config playwright.live.config.ts tests/live/case-study.spec.ts
